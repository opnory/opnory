# Local observability benchmark baseline.
# Collector + Jaeger + Tempo + Phoenix. The observability-bench harness itself
# is backend-neutral and talks only to these read APIs over HTTP.
#
# Ingest flows: collector receives OTLP on host 4317/4318 and fans out to each
# backend over the internal compose network. Backends expose ONLY their read
# APIs to the host — no per-backend ingest ports, avoiding host-port clashes.
#
# Start:  docker compose -f docker/compose.yml up -d
# Stop:   docker compose -f docker/compose.yml down

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4318:4318"   # OTLP/HTTP (harness ingress)
      - "4317:4317"   # OTLP/gRPC
    depends_on:
      - jaeger
      - tempo
      - phoenix

  jaeger:
    image: jaegertracing/all-in-one:1.60
    ports:
      - "16686:16686"   # UI + read query API (HTTP)
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - COLLECTOR_OTLP_GRPC_PORT=4317
      - COLLECTOR_OTLP_HTTP_PORT=4318

  tempo:
    image: grafana/tempo:2.5.0
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
    ports:
      - "3200:3200"   # query API (read / TraceQL)

  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006"   # UI + REST API (read)

volumes: {}