name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun ci

      - name: Type check
        run: bun run typecheck

      - name: Run tests
        run: bun test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opnory
      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql
          createdb opnory || true
        if: runner.os == 'Linux'

      - name: Build
        run: bun run build