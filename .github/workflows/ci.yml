name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opnory
      PGUSER: postgres
      PGPASSWORD: postgres
      OPNORY_ALLOW_UNPINNED_LIVE_TEST: "true"
      # Durable encrypted-secret proof (Phase 6) — runs real PostgreSQL proof.
      OPNORY_RUN_PG_INTEGRATION_TESTS: "1"
      OPNORY_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opnory_integration_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opnory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create integration-test database
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d opnory -c "CREATE DATABASE opnory_integration_test;" || true

      - name: Build all packages
        run: bun run build

      - name: Lint
        run: bun run lint

      - name: Run database migrations
        run: bun -e "import { migrate } from './packages/access-store-pg/src/index.js'; await migrate();"

      - name: Type check
        run: bun run typecheck

      - name: Run tests
        run: bun test