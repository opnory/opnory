name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opnory
      PGUSER: postgres
      PGPASSWORD: postgres
      OPNORY_ALLOW_UNPINNED_LIVE_TEST: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install

      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql
          # Wait for PostgreSQL to be ready
          for i in {1..30}; do
            if pg_isready -q; then
              break
            fi
            sleep 1
          done
          # Set password for postgres user
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
          # Create database using postgres user
          sudo -u postgres createdb opnory || true
          # Verify database exists and is accessible
          sudo -u postgres psql -c "SELECT 1" opnory
        if: runner.os == 'Linux'

      - name: Build all packages
        run: bun run build

      - name: Lint
        run: bun run lint

      - name: Run database migrations
        run: bun -e "import { migrate } from './packages/access-store-pg/src/index.js'; await migrate();"
        if: runner.os == 'Linux'

      - name: Type check
        run: bun run typecheck

      - name: Run tests
        run: bun test