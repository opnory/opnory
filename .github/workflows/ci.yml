name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Debug checkout
        run: |
          echo "=== Current directory ==="
          pwd
          echo ""
          echo "=== Root package.json ==="
          cat package.json | head -20
          echo ""
          echo "=== All directories ==="
          ls -la
          echo ""
          echo "=== Packages directory ==="
          ls -la packages/
          echo ""
          echo "=== Root tsconfig.json ==="
          cat tsconfig.json | head -20
          echo ""
          echo "=== packages/types/tsconfig.json ==="
          cat packages/types/tsconfig.json

      - name: Install dependencies
        run: bun install

      - name: Debug workspace
        run: |
          echo "=== Workspace packages ==="
          for d in packages/*/; do
            if [ -f "$d/package.json" ]; then
              echo "--- $d ---"
              cat "$d/package.json" | head -5
            fi
          done

      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql
          # Wait for PostgreSQL to be ready
          for i in {1..30}; do
            if pg_isready -q; then
              break
            fi
            sleep 1
          done
          # Set password for postgres user
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
          # Create database using postgres user
          sudo -u postgres createdb opnory || true
          # Verify database exists and is accessible
          sudo -u postgres psql -c "SELECT 1" opnory
        if: runner.os == 'Linux'

      - name: Run database migrations
        run: |
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/opnory bun -e "import { migrate } from './packages/access-store-pg/src/index.js'; await migrate();" 2>&1 || true
        if: runner.os == 'Linux'

      - name: Build all packages
        run: bun run build

      - name: Type check
        run: bun run typecheck

      - name: Run tests
        run: bun test
        env:
          DATABASE_URL: postgresql://postgres@localhost:5432/opnory
          PGUSER: postgres
          PGPASSWORD: postgres
          OPNORY_ALLOW_UNPINNED_LIVE_TEST: "true"