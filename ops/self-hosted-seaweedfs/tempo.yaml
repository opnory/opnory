# Tempo config: S3-compatible object storage via SeaweedFS (Gate 1A).
# Ingest + query over the private network. SeaweedFS exposes native S3 on 8333.
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  trace_idle_period: 2s
  max_block_bytes: 10000
  max_block_duration: 10s

compactor:
  compaction:
    block_retention: 24h

storage:
  trace:
    backend: s3
    blocklist_poll: 10s
    s3:
      endpoint: seaweedfs:8333
      bucket: tempo-traces
      access_key: ${S3_ACCESS_KEY}
      secret_key: ${S3_SECRET_KEY}
      insecure: true
      forcepathstyle: true

query_frontend:
  trace_by_id:
    duration_slo: 5s

querier:
  max_concurrent_queries: 20