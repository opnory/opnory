# Self-hosted Grafana OSS + Tempo OSS + MinIO + auth reverse-proxy
# Minimal SELF-HOSTED LIVE proof stack. Tempo is PRIVATE on the compose network
# (no host port). Ingest + query reach it only through the auth proxy (Caddy
# with basic auth). Grafana OSS talks to Tempo over the private network.
#
# Credentials are ephemeral/local-only, injected via .env (gitignored).

services:
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    ports:
      - "9001:9001"   # console (optional, local debug only)
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 5s
      retries: 20
    # No S3 API port on host: Tempo reaches MinIO over the internal network.
    networks: [tempo-net]

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
        mc mb --ignore-existing local/tempo-traces
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    networks: [tempo-net]

  tempo:
    image: grafana/tempo:2.5.0
    command: ["-config.file=/etc/tempo.yaml", "-config.expand-env=true"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
    environment:
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    depends_on:
      minio-init:
        condition: service_completed_successfully
    # NO host port: private on the network; reachable only via the auth proxy.
    networks: [tempo-net]

  grafana:
    image: grafana/grafana-oss:11.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - tempo
    # Grafana UI is host-exposed for the datasource connectivity proof only.
    ports:
      - "3000:3000"
    networks: [tempo-net]

  # Auth reverse proxy: the ONLY host-facing surface for Tempo ingest + query.
  # Tempo has no built-in auth; Caddy enforces basic auth and forwards to Tempo.
  authproxy:
    image: caddy:2.8.4
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    environment:
      TEMPO_BASIC_AUTH_HASH: ${TEMPO_BASIC_AUTH_HASH}
    ports:
      - "8080:8080"   # Tempo API via proxy (ingest + read)
    depends_on:
      - tempo
    networks: [tempo-net]

volumes:
  minio-data:

networks:
  tempo-net:
    driver: bridge